<!DOCTYPE html>

<html>

	<head>

		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>
			Contact: Emerald Escape
		</title>
		
		<!-- CSS Bootstrap -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		
		<!-- General CSS -->
		<link rel="stylesheet" href="../style/style.css"/>
	</head>

	<body>
		<!-- Banner Area -->
		<div class="container-fluid">
			<div class="row text-center navigation-experience">
				<div class="col-12 col-sm-4 boxStory">
					<a href="../index.html">Home</a>
				</div>
				<div class="col-12 col-sm-4 boxExperience">
					<a  href="../Experiences/experiences.html" target="_blank">Experiences</a>
				</div>		
				<div class="col-12 col-sm-4 boxAbout">
					<a href="contact.html" target="_blank">Contact</a>
				</div>
			</div>
		</div>


		<!-- Contact introduction and form -->
		<main class="contact">

		    <div id="contactIntroduction">
			    <h1>Contact Us</h1>
			    <p>
			        Reach out to us with any questions or queries,
			        we will get back to you as soon as possible.
			    </p>
			</div>

			<p id="confirmation"></p>
		    <form id="enquiryForm" class="contact-form" onsubmit="checkForm(event)" novalidate>

			    <h2>Your Details</h2>

			    <label for="name">Name *</label>
			    <input type="text" id="name" name="name" placeholder="Enter your name">
			    <span id="nameError"></span>

			    <label for="email">Email Address *</label>
			    <input type="email" id="email" name="email" placeholder="Enter your email address">
			    <span id="emailError"></span>

			    <label for="phone">Phone Number *</label>
			    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
			    <span id="phoneError"></span>

			    <h2>Your Enquiry</h2>

			    
			    <div class="booking-checkbox">
				    <label for="previousBooking">I have already made a booking.</label>
				    <input type="checkbox" id="previousBooking" name="previousBooking">
				</div>

			    <label for="enquiryType">Type of Enquiry *</label>
			    <select id="enquiryType" name="enquiryType">
			        <option value="">Please select an enquiry type</option>
			        <option value="booking">Booking</option>
			        <option value="payment">Payment</option>
			        <option value="general">General Information</option>
			        <option value="other">Other</option>
			    </select>
			    <span id="enquiryTypeError"></span>

			    <label for="message">Your Message *</label>
			    <textarea id="message" name="message" rows="6" placeholder="Tell us what you'd like to know..."></textarea>
			    <span id="messageError"></span>

			    <button type="submit">Send Enquiry</button>

			    <p class="form-note">Fields marked * are required.</p>

			</form>
		</main>


		<!-- JavaScript -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

		<!-- General Scripts -->

		<script src="../scripts/generalScript.js"></script>
	</body>
</html>
